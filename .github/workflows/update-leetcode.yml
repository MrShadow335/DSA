name: Update LEETCODE Submodule

on:
  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-leetcode:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout DSA
        uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0

      - name: Update LEETCODE submodule
        run: |
          git submodule update --remote LEETCODE

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add LEETCODE

          if git diff --cached --quiet; then
            echo "LEETCODE is already up to date."
          else
            git commit -m "Update LEETCODE submodule"
            git push origin main
          fi